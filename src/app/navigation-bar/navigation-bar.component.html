<nav
  class="bg-gradient-to-r from-saffron-600 via-saffron-500 to-red-600 w-full shadow-lg border-b border-saffron-700 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

    <!-- Brand + Back/Next buttons -->
    <div class="flex items-center gap-4">
      <a routerLink="/" class="flex items-center gap-2 group">
        <!-- Optional Icon -->
        <div
          class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-gold-300 group-hover:bg-white/20 transition-all">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z" />
          </svg>
        </div>
        <span
          class="text-xl font-bold text-white tracking-wide drop-shadow-sm group-hover:text-gold-200 transition-colors">
          Darshan Mahakaal
        </span>
      </a>

      <div *ngIf="userLoggedIn$ | async" class="hidden sm:flex space-x-2 ml-4">
        <button (click)="goBack()"
          class="px-3 py-1 text-xs font-semibold text-saffron-100 border border-saffron-400 rounded-full hover:bg-white/10 hover:text-white transition">Back</button>

        <button (click)="goForward()"
          class="px-3 py-1 text-xs font-semibold text-saffron-100 border border-saffron-400 rounded-full hover:bg-white/10 hover:text-white transition">Next</button>
      </div>
    </div>

    <!-- Desktop nav links -->
    <ul class="hidden md:flex items-center space-x-8 text-sm font-medium">
      <li><a routerLink="/" routerLinkActive="text-gold-300 font-bold border-b-2 border-gold-300 pb-1"
          [routerLinkActiveOptions]="{exact: true}" class="text-saffron-50 hover:text-white transition-colors">Home</a>
      </li>

      <ng-container *ngIf="userLoggedIn$ | async; else loggedOutLinks">
        <li><a routerLink="/userdashboard" routerLinkActive="text-gold-300 font-bold border-b-2 border-gold-300 pb-1"
            class="text-saffron-50 hover:text-white transition-colors">Dashboard</a></li>
        <li><a routerLink="/dashboard/viewprofile"
            routerLinkActive="text-gold-300 font-bold border-b-2 border-gold-300 pb-1"
            class="text-saffron-50 hover:text-white transition-colors">My Profile</a></li>
      </ng-container>

      <ng-template #loggedOutLinks>
        <li><a routerLink="/registration" routerLinkActive="text-gold-300 font-bold border-b-2 border-gold-300 pb-1"
            class="text-saffron-50 hover:text-white transition-colors">Registration</a></li>
        <li><a routerLink="/verifylogin" routerLinkActive="text-gold-300 font-bold border-b-2 border-gold-300 pb-1"
            class="text-saffron-50 hover:text-white transition-colors">Login</a></li>
      </ng-template>
    </ul>

    <!-- Logout button -->
    <div class="hidden md:flex">
      <button *ngIf="userLoggedIn$ | async" (click)="logout()"
        class="px-4 py-1.5 text-sm font-bold text-red-100 bg-red-800/30 border border-red-400/50 rounded-full hover:bg-red-900/50 hover:text-white transition shadow-sm">
        Logout
      </button>
    </div>

    <!-- Mobile hamburger -->
    <div class="md:hidden">
      <button (click)="menuOpen = !menuOpen"
        class="p-2 text-saffron-100 rounded-md hover:bg-white/10 hover:text-white transition">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
      </button>
    </div>
  </div>

  <!-- ✅ Mobile Menu -->
  <div *ngIf="menuOpen"
    class="md:hidden bg-saffron-50 border-t border-saffron-200 shadow-xl overflow-hidden animate-fadeIn">
    <ul class="flex flex-col items-start p-4 space-y-2 text-base font-medium">
      <li><a routerLink="/" (click)="menuOpen=false"
          class="w-full block px-4 py-2 rounded-lg text-gray-700 hover:bg-saffron-100 hover:text-saffron-800 transition">Home</a>
      </li>

      <ng-container *ngIf="userLoggedIn$ | async; else mobileLoggedOut">
        <li><a routerLink="/userdashboard" (click)="menuOpen=false"
            class="w-full block px-4 py-2 rounded-lg text-gray-700 hover:bg-saffron-100 hover:text-saffron-800 transition">Dashboard</a>
        </li>
        <li><a routerLink="/dashboard/viewprofile" (click)="menuOpen=false"
            class="w-full block px-4 py-2 rounded-lg text-gray-700 hover:bg-saffron-100 hover:text-saffron-800 transition">My
            Profile</a></li>
        <li class="w-full border-t border-gray-200 my-2 pt-2">
          <button (click)="logout(); menuOpen=false"
            class="w-full text-left px-4 py-2 text-red-600 font-semibold hover:bg-red-50 rounded-lg transition">
            Logout
          </button>
        </li>
      </ng-container>

      <ng-template #mobileLoggedOut>
        <li><a routerLink="/registration" (click)="menuOpen=false"
            class="w-full block px-4 py-2 rounded-lg text-gray-700 hover:bg-saffron-100 hover:text-saffron-800 transition">Registration</a>
        </li>
        <li><a routerLink="/verifylogin" (click)="menuOpen=false"
            class="w-full block px-4 py-2 rounded-lg text-gray-700 hover:bg-saffron-100 hover:text-saffron-800 transition">Login</a>
        </li>
      </ng-template>
    </ul>
  </div>
</nav>
