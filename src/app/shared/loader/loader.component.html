<div *ngIf="isLoading | async"
    class="fixed inset-0 z-[99999] flex items-center justify-center bg-white/80 backdrop-blur-sm transition-opacity duration-300">
    <div class="relative flex flex-col items-center">
        <!-- Outer Rotating Ring -->
        <div class="w-24 h-24 border-4 border-saffron-200 border-t-saffron-600 rounded-full animate-spin"></div>

        <!-- Inner Om Symbol (SVG) -->
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 animate-pulse-soft">
            <svg class="w-12 h-12 text-saffron-700" fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />
            </svg>
        </div>

        <div class="mt-8 text-saffron-800 font-semibold tracking-wider animate-pulse">
            Loading...
        </div>
    </div>
</div>
