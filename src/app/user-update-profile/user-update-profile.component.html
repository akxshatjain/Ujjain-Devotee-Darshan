<div class="min-h-screen bg-cream-50 flex items-center justify-center p-6">

  <!-- Success Message -->
  <div *ngIf="submitted; else updateForm"
    class="w-full max-w-2xl bg-white p-10 rounded-2xl shadow-xl border border-green-100 fade-in-up text-center">
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>
    <h3 class="text-2xl font-bold text-gray-900 mb-2">Profile Updated Successfully</h3>
    <p class="text-gray-600 mb-8">Your devotee information has been verified and saved.</p>

    <button
      class="bg-saffron-600 text-white px-8 py-3 rounded-full hover:bg-saffron-700 font-bold shadow-lg transition-transform hover:scale-105"
      (click)="goToDashboard()">
      Return to Dashboard
    </button>
  </div>

  <!-- Update Form -->
  <ng-template #updateForm>
    <div
      class="w-full max-w-5xl bg-white rounded-3xl shadow-xl border border-gold-200 overflow-hidden flex flex-col md:flex-row fade-in-up">

      <!-- Sidebar / Info Panel -->
      <aside
        class="md:w-1/3 bg-gradient-to-br from-saffron-600 to-red-600 p-10 text-white flex flex-col items-center justify-center text-center">
        <div class="w-32 h-32 rounded-full border-4 border-white/20 p-1 mb-6">
          <img *ngIf="profileData?.avatar" [src]="profileData.avatar" alt="User avatar"
            class="w-full h-full rounded-full object-cover bg-white" />
        </div>
        <h2 class="text-2xl font-bold mb-2">Update Profile</h2>
        <div class="w-12 h-1 bg-white/50 rounded-full mb-4"></div>
        <p class="text-saffron-100 text-sm leading-relaxed">
          Ensure your details are accurate for a smooth darshan booking experience.
        </p>
        <span
          class="mt-8 bg-black/20 text-white px-4 py-1 rounded-full text-xs font-semibold tracking-wide uppercase">Devotee
          Portal</span>
      </aside>

      <!-- Form Section -->
      <section class="md:w-2/3 p-10">
        <form [formGroup]="profileForm" (ngSubmit)="handleSubmit()" class="space-y-6">

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label for="name" class="text-sm font-semibold text-gray-700">Full Legal Name</label>
              <input id="name" type="text" formControlName="devoteee_name"
                class="w-full border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-saffron-500 focus:border-saffron-500 transition-all bg-gray-50"
                placeholder="As per Government ID" />
            </div>

            <div class="space-y-2">
              <label for="gender" class="text-sm font-semibold text-gray-700">Gender</label>
              <select id="gender" formControlName="gender"
                class="w-full border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-saffron-500 focus:border-saffron-500 transition-all bg-gray-50">
                <option value="" disabled>Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label for="dob" class="text-sm font-semibold text-gray-700">Date of Birth</label>
              <input id="dob" type="date" formControlName="dob"
                class="w-full border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-saffron-500 focus:border-saffron-500 transition-all bg-gray-50" />
            </div>

            <div class="space-y-2">
              <label for="aadhar" class="text-sm font-semibold text-gray-700">Aadhar Number (Optional)</label>
              <input id="aadhar" type="text" formControlName="aadhar" placeholder="XXXX XXXX XXXX" maxlength="12"
                class="w-full border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-saffron-500 focus:border-saffron-500 transition-all bg-gray-50" />
            </div>
          </div>

          <div class="space-y-2">
            <label for="address" class="text-sm font-semibold text-gray-700">Permanent Address</label>
            <textarea id="address" formControlName="address" rows="3" placeholder="Enter your full residential address"
              class="w-full border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-saffron-500 focus:border-saffron-500 transition-all bg-gray-50"></textarea>
          </div>

          <div class="pt-6 border-t border-gray-100 flex items-center justify-between">
            <button type="button"
              class="text-gray-500 hover:text-gray-700 text-sm font-medium px-4 py-2 rounded hover:bg-gray-100 transition"
              (click)="resetForm()">
              Reset Form
            </button>

            <button type="submit" [disabled]="loading"
              class="bg-gradient-to-r from-saffron-600 to-saffron-500 text-white px-8 py-3 rounded-full hover:shadow-lg font-bold transition-all transform hover:-translate-y-0.5 disabled:opacity-70 disabled:cursor-not-allowed flex items-center gap-2">
              <span *ngIf="loading"
                class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              {{ loading ? 'Updating...' : 'Save Changes' }}
            </button>
          </div>
        </form>
      </section>
    </div>
  </ng-template>
</div>
