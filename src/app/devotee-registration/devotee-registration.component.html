<div class="min-h-screen flex items-center justify-center p-4 bg-gray-50">
  <div class="w-full max-w-md bg-white shadow-md rounded-lg p-10">
    <form class="space-y-4" (ngSubmit)="registerDevotee($event)">
      <h2 class="text-xl font-semibold">Devotee Registration</h2>

      <div>
        <label for="phone" class="block text-sm font-medium text-gray-700">
          Phone Number
        </label>
        <input
          id="phone"
          type="tel"
          [(ngModel)]="phone"
          name="phone"
          placeholder="Enter phone number (e.g. 1234567890)"
          inputmode="tel"
          autocomplete="tel"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>

      <div>
        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md disabled:opacity-70"
          [disabled]="loading"
        >
          {{ loading ? 'Requesting...' : 'Register' }}
        </button>
      </div>

      <a
        routerLink="/login"
        class="text-blue-600 hover:text-blue-800 text-sm"
      >
        Already registered? Login
      </a>
    </form>
  </div>
</div>
