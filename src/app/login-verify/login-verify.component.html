<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4">
  <div class="card w-full max-w-md p-10">
    <form (ngSubmit)="loginVerifyAction()" [class.loading]="loading">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">Login</h2>

      <span class="badge badge-indigo mb-4">{{ user_type }}</span>

      <div class="form-group mb-4">
        <label for="phone">Phone</label>
        <input
          id="phone"
          type="text"
          [(ngModel)]="phone"
          name="phone"
          placeholder="Phone"
          required
          class="form-input w-full"
        />
      </div>

      <div class="form-group mb-4">
        <label for="temp">Password</label>
        <input
          id="temp"
          type="text"
          [(ngModel)]="temp_pwd"
          name="temp_pwd"
          placeholder="Enter password"
          [disabled]="loading"
          class="form-input w-full"
        />
      </div>

      <button type="submit" [disabled]="loading" class="btn btn-blue w-full">
        {{ loading ? 'Verifying...' : 'Login' }}
      </button>
    </form>
  </div>
</div>
