<div class="min-h-screen bg-cream-50 flex items-center justify-center p-4">
  <div class="flex w-full max-w-4xl bg-white rounded-2xl shadow-2xl overflow-hidden border border-gold-200">

    <!-- Left Section: Image/Branding -->
    <div
      class="hidden md:flex md:w-1/2 bg-gradient-to-br from-saffron-600 to-red-600 relative overflow-hidden flex-col items-center justify-center text-white p-12">
      <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-20"></div>

      <div class="relative z-10 text-center">
        <div
          class="w-24 h-24 mb-6 mx-auto bg-white/20 backdrop-blur rounded-full flex items-center justify-center shadow-lg border-2 border-gold-300">
          <svg class="w-14 h-14 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />
          </svg>
        </div>
        <h2 class="text-3xl font-bold mb-2">Shree Mahakaal</h2>
        <p class="text-saffron-100 font-light text-lg">Official Devotee Portal</p>
      </div>
    </div>

    <!-- Right Section: Login Form -->
    <div class="w-full md:w-1/2 p-10 flex flex-col justify-center relative">
      <div class="absolute top-0 right-0 p-4">
        <span
          class="inline-block px-3 py-1 text-xs font-semibold uppercase tracking-wider text-saffron-700 bg-saffron-100 rounded-full border border-saffron-200">
          {{ user_type || 'Devotee' }} Access
        </span>
      </div>

      <h2 class="text-3xl font-bold text-gray-800 mb-2">Welcome Back</h2>
      <p class="text-gray-500 mb-8">Please enter your verified mobile number to proceed.</p>

      <form (ngSubmit)="loginVerifyAction()" class="space-y-6">

        <div class="group">
          <label for="phone" class="block text-sm font-semibold text-gray-700 mb-2">Mobile Number</label>
          <div class="relative">
            <span class="absolute left-4 top-3.5 text-gray-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z">
                </path>
              </svg>
            </span>
            <input id="phone" type="text" [(ngModel)]="phone" name="phone" placeholder="e.g. 9876543210" required
              class="w-full pl-12 pr-4 py-3 rounded-lg border border-gray-300 focus:border-saffron-500 focus:ring-2 focus:ring-saffron-200 transition-all outline-none" />
          </div>
        </div>

        <div>
          <label for="temp" class="block text-sm font-semibold text-gray-700 mb-2">Password / OTP</label>
          <div class="relative">
            <span class="absolute left-4 top-3.5 text-gray-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                </path>
              </svg>
            </span>
            <input id="temp" type="password" [(ngModel)]="temp_pwd" name="temp_pwd" placeholder="Enter your password"
              [disabled]="loading"
              class="w-full pl-12 pr-4 py-3 rounded-lg border border-gray-300 focus:border-saffron-500 focus:ring-2 focus:ring-saffron-200 transition-all outline-none" />
          </div>
        </div>

        <button type="submit" [disabled]="loading"
          class="w-full bg-saffron-600 text-white font-bold text-lg py-3 rounded-lg shadow-md hover:bg-saffron-700 active:scale-[0.98] transition-all disabled:opacity-70 disabled:cursor-not-allowed flex justify-center items-center gap-2">
          <span *ngIf="loading"
            class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          {{ loading ? 'Verifying...' : 'Secure Login' }}
        </button>

        <p class="text-center text-sm text-gray-500 mt-4">
          Not registered yet? <a routerLink="/registration" class="text-saffron-600 font-bold hover:underline">Create an
            account</a>
        </p>

      </form>
    </div>
  </div>
</div>
